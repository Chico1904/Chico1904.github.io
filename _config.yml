# =============================================
#   SITE SETTINGS
# =============================================
title: "FM"
tagline: "(wannabe) Robotics Engineer"
description: ""
url: "https://chico1904.github.io"
baseurl: ""

author:
  name: "Francisco Miranda"
  github: "Chico1904"
  bio: "(wannabe) Robotics Engineer"
  avatar: "/assets/images/me.jpg"  
  email: "franmira2003@gmail.com"

# =============================================
#   THEME
# =============================================
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "air" #contrast, mint, neon, plum | air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise

# =============================================
#   PLUGINS
# =============================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache

# =============================================
#   DEFAULTS
# =============================================
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# =============================================
#   MARKDOWN & SYNTAX HIGHLIGHTING
# =============================================
markdown: kramdown
highlighter: rouge

# =============================================
#   EXCLUSIONS
# =============================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .gitignore
  - vendor/
