# =============================================
#   SITE SETTINGS
# =============================================
title: "Francisco Miranda"
tagline: "Robotics Engineer"
description: ""
url: "https://chico1904.github.io"
baseurl: ""

# author:
#   name: "Francisco Miranda"
#   email: "franmira2003gmail.com"
#   github: "Chico1904"

# =============================================
#   THEME
# =============================================
theme: minima
minima:
  skin: dark  # auto | classic | dark | solarized | solarized-dark

# =============================================
#   NAVIGATION
# =============================================
header_pages:
  - index.md
  - projects.md
  - research.md

# =============================================
#   PLUGINS
# =============================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# =============================================
#   MARKDOWN & SYNTAX HIGHLIGHTING
# =============================================
markdown: kramdown
highlighter: rouge

# =============================================
#   EXCLUSIONS
# =============================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .gitignore
  - vendor/
