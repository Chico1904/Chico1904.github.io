# =============================================
#   SITE SETTINGS
# =============================================
title: "Your Name"
tagline: "Robotics Engineer"
description: "Personal website of Your Name - Robotics Engineer."
url: "https://chico1904.github.io"
baseurl: ""

author:
  name: "Francisco Miranda"
  email: "franmira2003gmail.com"
  github: "Chico1904"

# =============================================
#   THEME
# =============================================
theme: minima
minima:
  skin: auto  # auto | classic | dark | solarized | solarized-dark

# =============================================
#   NAVIGATION
# =============================================
header_pages:
  - index.md
  - projects.md
  - research.md

# =============================================
#   PLUGINS
# =============================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# =============================================
#   MARKDOWN & SYNTAX HIGHLIGHTING
# =============================================
markdown: kramdown
highlighter: rouge

# =============================================
#   EXCLUSIONS
# =============================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .gitignore
  - vendor/
