# =============================================
#   SITE SETTINGS
# =============================================
title: "FM"
tagline: "(wannabe) Robotics Engineer"
description: "MSc Robotics @ KTH | 3D Vision & Scene Understanding"
url: "https://chico1904.github.io"
baseurl: ""

author:
  name: "Francisco Miranda"
  avatar: "/assets/images/me.jpeg"
  bio: "MSc Robotics @ KTH\n3D Vision | Scene Understanding"
  location: "Stockholm, Sweden"
  github: "Chico1904"
  email: "franmira2003@gmail.com"

# =============================================
#   THEME
# =============================================
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "air" # contrast, mint, neon, plum | air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise

# =============================================
#   PLUGINS
# =============================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache

# =============================================
#   DEFAULTS
# =============================================
defaults:
  # Pages: About, Projects, Research
  - scope:
      path: ""
      type: pages
    values:
      layout: single   # normal page layout (no splash)
      classes: wide   # full-width content
      author_profile: true

# =============================================
#   MARKDOWN & SYNTAX HIGHLIGHTING
# =============================================
markdown: kramdown
highlighter: rouge

# =============================================
#   EXCLUSIONS
# =============================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .gitignore
  - vendor/